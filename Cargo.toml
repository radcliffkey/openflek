[package]
name = "openflek"
version = "0.2.0"
edition = "2024"
description = "Open-source remake of the 1992 Czech DOS card game Flek!"
license = "MIT"

[dependencies]
macroquad = "0.4"
font8x8 = "0.3"
log = "0.4"

# The browser build logs to the console instead (see `web`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }

[features]
default = ["sound"]
# PC-speaker style sound; on Linux it needs the ALSA development package.
sound = ["macroquad/audio"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
